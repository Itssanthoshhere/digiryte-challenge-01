services:
  - type: web
    name: digiryte-secure-api
    env: node
    plan: free
    buildCommand: npm install --include=optional && cd client && npm install --include=optional && cd .. && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: STRICT_REDIS
        value: "true"
      - key: CORS_ORIGINS
        value: "https://digiryte-challenge-01.vercel.app"
